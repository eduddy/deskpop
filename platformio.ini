[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5StickCPlus
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; ── M5StickC Plus2 ───────────────────────────────────────────────────────────
; Same 135×240 ST7789 panel as M5StickC Plus but different pin assignments,
; AXP2101 PMIC, and QMI8658 IMU. Uses TFT_eSPI directly to avoid M5GFX
; conflicts; power managed via deep-sleep / analogWrite backlight.
[env:m5stickc-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_PLUS2=1
    ; ── TFT_eSPI display config ──────────────────────────────────────────────
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=15
    -DTFT_SCLK=13
    -DTFT_CS=5
    -DTFT_DC=14
    -DTFT_RST=12
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    ; ── Button pins (active-LOW, internal pull-up) ───────────────────────────
    -DBTN_A_PIN=37
    -DBTN_B_PIN=39
    ; ── LED: GPIO 19, active-LOW ─────────────────────────────────────────────
    -DHW_LED_PIN=19
    ; ── No passive buzzer fitted ─────────────────────────────────────────────
    -DBUZZER_PIN=-1
build_src_filter = +<*> +<buddies/>
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; ── Ideaspark 1.14" ESP32 + MPU6050 ─────────────────────────────────────────
; Same 135×240 ST7789 panel as M5StickC Plus.
; Pin assignments below match the common Ideaspark module. If your board
; differs, adjust the -DTFT_* and BTN_*_PIN values here.
[env:ideaspark-114-esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_IDEASPARK=1
    ; ── TFT_eSPI display config ──────────────────────────────────────────────
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=32
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    ; ── Button pins (adjust if your board differs) ───────────────────────────
    ; BTN_A_PIN = BOOT button (GPIO 0), active-LOW, internal pull-up OK.
    ; BTN_B_PIN = side button; GPIO 35 is input-only — add a 10kΩ to 3V3.
    -DBTN_A_PIN=0
    -DBTN_B_PIN=35
    ; ── Optional buzzer (passive, between GPIO and GND) ─────────────────────
    -DBUZZER_PIN=-1
    ; ── Onboard LED: GPIO 2 is the TFT DC line — disabled to avoid conflict ─
    -DHW_LED_PIN=-1
build_src_filter = +<*> +<buddies/>
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit BusIO @ ^1.16.2
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
